<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Admin Panel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
      font-size: 16px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>School Admin Panel</h1>

  <h2>Upload Photo</h2>

  <select id="folder">
    <option value="school-photos">School Photos</option>
    <option value="student-photos">Student Photos</option>
    <option value="classroom">Classroom Photos</option>
    <option value="events">School Events</option>
  </select>

  <input type="file" id="photo" accept="image/*">

  <button id="uploadBtn">Upload Photo</button>

  <p id="status"></p>


  <script type="module">

    /* =========================================
       FIREBASE
    ========================================= */

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAcaBT2lSE6DIN9sxMak1Q8ibTU1d2-c2s",
      authDomain: "ghss-chowk-sarwar-shahee-3837e.firebaseapp.com",
      databaseURL: "https://ghss-chowk-sarwar-shahee-3837e-default-rtdb.firebaseio.com",
      projectId: "ghss-chowk-sarwar-shahee-3837e",
      storageBucket: "ghss-chowk-sarwar-shahee-3837e.firebasestorage.app",
      messagingSenderId: "367118817510",
      appId: "1:367118817510:web:a9e0a9af17b780852d8327"
    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);


    /* =========================================
       CLOUDINARY
    ========================================= */

    const CLOUD_NAME = "xplblky";

    const UPLOAD_PRESET = "sy19vok1";

    /* =========================================
       UPLOAD PHOTO
    ========================================= */

    document.getElementById("uploadBtn").addEventListener("click", async () => {

      const fileInput = document.getElementById("photo");
      const folder = document.getElementById("folder").value;
      const status = document.getElementById("status");

      const file = fileInput.files[0];


      /* No photo selected */

      if (!file) {
        status.innerText = "Pehle photo select karo.";
        return;
      }


      /* Check image */

      if (!file.type.startsWith("image/")) {
        status.innerText = "Sirf image upload karo.";
        return;
      }


      status.innerText = "Photo upload ho rahi hai...";


      try {

        /* =========================================
           CLOUDINARY UPLOAD
        ========================================= */

        const cloudinaryURL =
          `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;


        const formData = new FormData();

        formData.append("file", file);

        formData.append("upload_preset", UPLOAD_PRESET);

        formData.append("folder", folder);


        const response = await fetch(cloudinaryURL, {
          method: "POST",
          body: formData
        });


        const data = await response.json();


        /* Cloudinary error */

        if (!response.ok) {

          console.error("Cloudinary Error:", data);

          throw new Error(
            data.error?.message || "Cloudinary upload failed."
          );

        }


        /* =========================================
           GET CLOUDINARY PHOTO URL
        ========================================= */

        const photoURL = data.secure_url;

        const publicID = data.public_id;


        console.log("Cloudinary Photo URL:", photoURL);


        /* =========================================
           SAVE PHOTO URL IN FIREBASE DATABASE
        ========================================= */

        await push(ref(db, folder), {

          url: photoURL,

          publicId: publicID,

          name: file.name,

          uploadedAt: Date.now()

        });


        /* =========================================
           SUCCESS
        ========================================= */

        status.innerText =
          "Photo successfully upload ho gayi! ✅";


        /* Clear selected file */

        fileInput.value = "";


      } catch (error) {

        console.error(error);

        status.innerText =
          "Upload failed: " + error.message;

      }

    });

  </script>

</body>
</html>
