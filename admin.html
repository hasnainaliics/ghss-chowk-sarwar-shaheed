<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Admin Panel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
      font-size: 16px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      word-break: break-word;
    }
  </style>

  <!-- Cloudinary Upload Widget -->
  <script
    src="https://upload-widget.cloudinary.com/global/all.js"
    type="text/javascript">
  </script>

</head>

<body>

  <h1>School Admin Panel</h1>

  <h2>Upload Photo</h2>

  <select id="folder">
    <option value="school-photos">School Photos</option>
    <option value="student-photos">Student Photos</option>
    <option value="classroom">Classroom Photos</option>
    <option value="events">School Events</option>
  </select>

  <button id="uploadBtn">
    Choose Photo & Upload
  </button>

  <p id="status"></p>


  <script type="module">

    /* =========================================
       FIREBASE
    ========================================= */

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAcaBT2lSE6DIN9sxMak1Q8ibTU1d2-c2s",
      authDomain: "ghss-chowk-sarwar-shahee-3837e.firebaseapp.com",
      databaseURL: "https://ghss-chowk-sarwar-shahee-3837e-default-rtdb.firebaseio.com",
      projectId: "ghss-chowk-sarwar-shahee-3837e",
      storageBucket: "ghss-chowk-sarwar-shahee-3837e.firebasestorage.app",
      messagingSenderId: "367118817510",
      appId: "1:367118817510:web:a9e0a9af17b780852d8327"
    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);


    /* =========================================
       CLOUDINARY
    ========================================= */

    const CLOUD_NAME = "xplblky";

    const UPLOAD_PRESET = "sy19vok1";


    /* =========================================
       STATUS
    ========================================= */

    const status =
      document.getElementById("status");


    /* =========================================
       UPLOAD BUTTON
    ========================================= */

    document
      .getElementById("uploadBtn")
      .addEventListener("click", () => {

        const folder =
          document.getElementById("folder").value;


        status.innerText =
          "Photo select karo...";


        /* =========================================
           CLOUDINARY UPLOAD WIDGET
        ========================================= */

        const widget =
          cloudinary.createUploadWidget(

            {
              cloudName: CLOUD_NAME,

              uploadPreset: UPLOAD_PRESET,

              multiple: false,

              maxFiles: 1,

              sources: [
                "local"
              ],

              clientAllowedFormats: [
                "jpg",
                "jpeg",
                "png",
                "webp"
              ]

            },

            async (error, result) => {


              /* =========================================
                 ERROR
              ========================================= */

              if (error) {

                console.error(
                  "Cloudinary Widget Error:",
                  error
                );

                status.innerText =
                  "❌ Cloudinary Error: " +
                  (
                    error.status ||
                    error.message ||
                    JSON.stringify(error)
                  );

                return;
              }


              /* =========================================
                 UPLOAD SUCCESS
              ========================================= */

              if (
                result &&
                result.event === "success"
              ) {

                console.log(
                  "Cloudinary Result:",
                  result.info
                );


                const photoURL =
                  result.info.secure_url;


                const publicID =
                  result.info.public_id;


                const fileName =
                  result.info.original_filename ||
                  "photo";


                status.innerText =
                  "Cloudinary upload successful. Firebase mein save ho raha hai...";


                try {

                  /* =========================================
                     SAVE URL TO FIREBASE
                  ========================================= */

                  await push(
                    ref(db, folder),
                    {

                      url: photoURL,

                      publicId: publicID,

                      name: fileName,

                      uploadedAt: Date.now()

                    }
                  );


                  /* =========================================
                     FINAL SUCCESS
                  ========================================= */

                  status.innerText =
                    "✅ Photo successfully upload ho gayi!";


                } catch (firebaseError) {

                  console.error(
                    "Firebase Error:",
                    firebaseError
                  );

                  status.innerText =
                    "❌ Cloudinary upload ho gayi, lekin Firebase mein save nahi hui: " +
                    firebaseError.message;

                }

              }

            }

          );


        /* OPEN WIDGET */

        widget.open();

      });

  </script>

</body>
</html>
