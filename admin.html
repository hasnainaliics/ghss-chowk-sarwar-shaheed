<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Admin Panel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
      font-size: 16px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>School Admin Panel</h1>

  <h2>Upload Photo</h2>

  <select id="folder">
    <option value="school-photos">School Photos</option>
    <option value="student-photos">Student Photos</option>
    <option value="classroom">Classroom Photos</option>
    <option value="events">School Events</option>
  </select>

  <button id="uploadBtn">
    Choose Photo & Upload
  </button>

  <p id="status"></p>


  <script type="module">

    /* =========================================
       FIREBASE
    ========================================= */

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAcaBT2lSE6DIN9sxMak1Q8ibTU1d2-c2s",
      authDomain: "ghss-chowk-sarwar-shahee-3837e.firebaseapp.com",
      databaseURL: "https://ghss-chowk-sarwar-shahee-3837e-default-rtdb.firebaseio.com",
      projectId: "ghss-chowk-sarwar-shahee-3837e",
      storageBucket: "ghss-chowk-sarwar-shahee-3837e.firebasestorage.app",
      messagingSenderId: "367118817510",
      appId: "1:367118817510:web:a9e0a9af17b780852d8327"
    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);


    /* =========================================
       IMGBB
    ========================================= */

    const IMGBB_API_KEY =
      "0575dff684237d097549a2cc3683b2bf";


    /* =========================================
       STATUS
    ========================================= */

    const status =
      document.getElementById("status");


    /* =========================================
       UPLOAD BUTTON
    ========================================= */

    document
      .getElementById("uploadBtn")
      .addEventListener("click", () => {

        const folder =
          document.getElementById("folder").value;


        /* =========================================
           CREATE FILE INPUT
        ========================================= */

        const input =
          document.createElement("input");

        input.type = "file";

        input.accept =
          "image/jpeg,image/png,image/webp";


        input.onchange =
          async function () {

            const file =
              input.files[0];


            if (!file) {
              return;
            }


            /* =========================================
               CHECK FILE SIZE
            ========================================= */

            if (file.size > 32 * 1024 * 1024) {

              status.innerText =
                "❌ Photo 32MB se chhoti honi chahiye.";

              return;
            }


            status.innerText =
              "⏳ Photo ImgBB par upload ho rahi hai...";


            try {

              /* =========================================
                 CREATE FORM DATA
              ========================================= */

              const formData =
                new FormData();

              formData.append(
                "key",
                IMGBB_API_KEY
              );

              formData.append(
                "image",
                file
              );


              /* =========================================
                 UPLOAD TO IMGBB
              ========================================= */

              const response =
                await fetch(
                  "https://api.imgbb.com/1/upload",
                  {
                    method: "POST",
                    body: formData
                  }
                );


              const result =
                await response.json();


              console.log(
                "ImgBB Result:",
                result
              );


              /* =========================================
                 CHECK IMGBB ERROR
              ========================================= */

              if (
                !response.ok ||
                !result.success
              ) {

                throw new Error(
                  result.error?.message ||
                  "ImgBB upload failed"
                );

              }


              /* =========================================
                 GET IMAGE URL
              ========================================= */

              const photoURL =
                result.data.display_url ||
                result.data.url;


              const deleteURL =
                result.data.delete_url || "";


              const fileName =
                file.name ||
                "photo";


              status.innerText =
                "⏳ Photo upload ho gayi. Firebase mein save ho rahi hai...";


              /* =========================================
                 SAVE URL TO FIREBASE
              ========================================= */

              await push(
                ref(db, folder),
                {

                  url: photoURL,

                  name: fileName,

                  deleteUrl: deleteURL,

                  uploadedAt: Date.now()

                }
              );


              /* =========================================
                 FINAL SUCCESS
              ========================================= */

              status.innerText =
                "✅ Photo successfully upload ho gayi!";


            } catch (error) {

              console.error(
                "Upload Error:",
                error
              );


              status.innerText =
                "❌ Upload failed: " +
                error.message;

            }

          };


        /* OPEN PHONE GALLERY */

        input.click();

      });

  </script>

</body>
</html>
