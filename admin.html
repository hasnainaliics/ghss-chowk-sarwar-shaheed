<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHSS Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#2563eb;
  color:white;
  padding:20px;
}

header h2{
  margin-bottom:5px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px #0001;
}

.card b{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.upload{
  background:white;
  padding:20px;
  border-radius:12px;
  margin:20px 0;
  box-shadow:0 3px 12px #0001;
}

input,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

button{
  border:0;
  padding:12px 18px;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-size:15px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.photo{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 12px #0001;
}

.photo img{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.photo-info{
  padding:12px;
}

.photo-name{
  font-weight:bold;
  word-break:break-word;
}

.folder{
  color:#666;
  font-size:13px;
  margin-top:5px;
}

.delete{
  width:100%;
  background:#dc2626;
  margin-top:10px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  background:white;
  padding:30px;
  border-radius:12px;
  color:#777;
}

@media(max-width:800px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }

  .photo img{
    height:150px;
  }
}

@media(max-width:500px){
  .container{
    padding:12px;
  }

  .cards{
    gap:8px;
  }

  .card{
    padding:15px;
  }

  .card b{
    font-size:24px;
  }

  .gallery{
    gap:10px;
  }

  .photo img{
    height:130px;
  }
}
</style>
</head>

<body>

<header>
  <h2>🏫 GHSS Admin Panel</h2>
  <p>Powered & Developed by Hasnain Ali</p>
</header>

<div class="container">

  <div class="cards">

    <div class="card">
      Total Photos
      <b id="total">0</b>
    </div>

    <div class="card">
      School
      <b id="school">0</b>
    </div>

    <div class="card">
      College
      <b id="college">0</b>
    </div>

    <div class="card">
      Events
      <b id="events">0</b>
    </div>

  </div>


  <div class="upload">

    <h3>📤 Upload Photo</h3>

    <input
      type="file"
      id="photoFile"
      accept="image/*"
    >

    <select id="folderSelect">

      <option value="school-photos">
        School Photos
      </option>

      <option value="college-photos">
        College Photos
      </option>

      <option value="classroom">
        Classroom
      </option>

      <option value="events">
        Events
      </option>

    </select>

    <br><br>

    <button id="uploadBtn">
      ＋ Upload Photo
    </button>

  </div>


  <div class="gallery" id="gallery">

    <div class="empty">
      Loading photos...
    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  remove
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyAcaBT2lSE6DIN9sxMak1Q8ibTU1d2-c2s",

  authDomain:
  "ghss-chowk-sarwar-shahee-3837e.firebaseapp.com",

  databaseURL:
  "https://ghss-chowk-sarwar-shaheed-3837e-default-rtdb.firebaseio.com",

  projectId:
  "ghss-chowk-sarwar-shaheed-3837e",

  storageBucket:
  "ghss-chowk-sarwar-shaheed-3837e.firebasestorage.app",

  messagingSenderId:
  "367118817510",

  appId:
  "1:367118817510:web:a9e0a9af17b780852d8327"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* =========================
   IMGBB
========================= */

const IMGBB_KEY =
"0575dff684237d097549a2cc3683b2bf";


/* =========================
   ELEMENTS
========================= */

const photoFile =
document.getElementById("photoFile");

const folderSelect =
document.getElementById("folderSelect");

const uploadBtn =
document.getElementById("uploadBtn");

const gallery =
document.getElementById("gallery");

const total =
document.getElementById("total");

const school =
document.getElementById("school");

const college =
document.getElementById("college");

const events =
document.getElementById("events");


/* =========================
   DATA
========================= */

const folders = [
  "school-photos",
  "college-photos",
  "classroom",
  "events"
];

let photos = [];


/* =========================
   LOAD ALL PHOTOS
========================= */

async function loadPhotos(){

  photos = [];

  for(const folder of folders){

    const folderRef =
    ref(db, folder);

    onValue(folderRef, (snapshot)=>{

      const data =
      snapshot.val() || {};

      /*
        Remove old records
        from this folder first
      */

      photos =
      photos.filter(
        photo => photo.folder !== folder
      );


      Object.entries(data).forEach(
        ([id, photo])=>{

          photos.push({

            ...photo,

            id:id,

            folder:folder

          });

        }
      );


      showPhotos();

    });

  }

}


/* =========================
   SHOW PHOTOS
========================= */

function showPhotos(){

  gallery.innerHTML = "";


  if(photos.length === 0){

    gallery.innerHTML = `
      <div class="empty">
        📷 No photos uploaded yet.
      </div>
    `;

  }


  photos.forEach(photo=>{

    const card =
    document.createElement("div");

    card.className = "photo";


    card.innerHTML = `

      <img
        src="${escapeHTML(photo.url || "")}"
        alt="Photo"
      >

      <div class="photo-info">

        <div class="photo-name">
          ${escapeHTML(
            photo.name || "Photo"
          )}
        </div>

        <div class="folder">
          📁 ${escapeHTML(
            photo.folder
          )}
        </div>

        <button class="delete">
          🗑 Delete
        </button>

      </div>

    `;


    const deleteButton =
    card.querySelector(".delete");


    deleteButton.addEventListener(
      "click",
      ()=>deletePhoto(
        photo.folder,
        photo.id
      )
    );


    gallery.appendChild(card);

  });


  total.textContent =
  photos.length;


  school.textContent =
  photos.filter(
    p => p.folder === "school-photos"
  ).length;


  college.textContent =
  photos.filter(
    p => p.folder === "college-photos"
  ).length;


  events.textContent =
  photos.filter(
    p => p.folder === "events"
  ).length;

}


/* =========================
   UPLOAD
========================= */

uploadBtn.addEventListener(
  "click",
  uploadPhoto
);


async function uploadPhoto(){

  const file =
  photoFile.files[0];


  if(!file){

    alert("⚠️ Pehle photo select karo.");

    return;

  }


  if(!file.type.startsWith("image/")){

    alert("⚠️ Sirf image select karo.");

    return;

  }


  uploadBtn.disabled = true;

  uploadBtn.textContent =
  "⏳ Uploading...";


  try{

    /*
      STEP 1
      Upload to ImgBB
    */

    const formData =
    new FormData();

    formData.append(
      "key",
      IMGBB_KEY
    );

    formData.append(
      "image",
      file
    );


    const response =
    await fetch(
      "https://api.imgbb.com/1/upload",
      {
        method:"POST",
        body:formData
      }
    );


    const result =
    await response.json();


    if(!result.success){

      console.error(result);

      throw new Error(
        "ImgBB upload failed"
      );

    }


    /*
      STEP 2
      Save URL to Firebase
    */

    const folder =
    folderSelect.value;


    const photoRef =
    push(ref(db, folder));


    await set(photoRef,{

      url:
      result.data.display_url ||
      result.data.url,

      name:
      file.name,

      caption:
      "",

      deleteUrl:
      result.data.delete_url || "",

      imgbbId:
      result.data.id || "",

      uploadedAt:
      Date.now()

    });


    /*
      SUCCESS
    */

    alert(
      "✅ Photo successfully uploaded!"
    );


    photoFile.value = "";


  }catch(error){

    console.error(error);

    alert(
      "❌ Upload failed!\n\n" +
      "Internet connection check karo."
    );

  }finally{

    uploadBtn.disabled = false;

    uploadBtn.textContent =
    "＋ Upload Photo";

  }

}


/* =========================
   DELETE
========================= */

async function deletePhoto(
  folder,
  id
){

  const confirmDelete =
  confirm(
    "⚠️ Kya aap ye photo delete karna chahte ho?"
  );


  if(!confirmDelete){

    return;

  }


  try{

    await remove(
      ref(
        db,
        folder + "/" + id
      )
    );


    alert(
      "🗑 Photo deleted successfully!"
    );


  }catch(error){

    console.error(error);

    alert(
      "❌ Photo delete nahi ho saki."
    );

  }

}


/* =========================
   SECURITY / TEXT
========================= */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

loadPhotos();

</script>

</body>
      </html>
