<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Admin Panel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
      font-size: 16px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>School Admin Panel</h1>

  <h2>Upload Photo</h2>

  <select id="folder">
    <option value="school-photos">School Photos</option>
    <option value="student-photos">Student Photos</option>
    <option value="classroom">Classroom Photos</option>
    <option value="events">School Events</option>
  </select>

  <input type="file" id="photo" accept="image/*">

  <button id="uploadBtn">Upload Photo</button>

  <p id="status"></p>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAcaBT2lSE6DIN9sxMak1Q8ibTU1d2-c2s",
      authDomain: "ghss-chowk-sarwar-shahee-3837e.firebaseapp.com",
      databaseURL: "https://ghss-chowk-sarwar-shahee-3837e-default-rtdb.firebaseio.com",
      projectId: "ghss-chowk-sarwar-shahee-3837e",
      storageBucket: "ghss-chowk-sarwar-shahee-3837e.firebasestorage.app",
      messagingSenderId: "367118817510",
      appId: "1:367118817510:web:a9e0a9af17b780852d8327"
    };


    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);


    document.getElementById("uploadBtn").addEventListener("click", async () => {

      const file = document.getElementById("photo").files[0];
      const folder = document.getElementById("folder").value;
      const status = document.getElementById("status");

      if (!file) {
        status.innerText = "Pehle photo select karo.";
        return;
      }

      status.innerText = "Photo upload ho rahi hai...";

      try {

        const fileName = Date.now() + "_" + file.name;

        const storageRef = ref(
          storage,
          folder + "/" + fileName
        );

        await uploadBytes(storageRef, file);

        const downloadURL = await getDownloadURL(storageRef);

        console.log("Photo URL:", downloadURL);

        status.innerText = "Photo successfully upload ho gayi!";

      } catch (error) {

        console.error(error);

        status.innerText =
          "Upload failed: " + error.message;

      }

    });

  </script>

</body>
    </html>
