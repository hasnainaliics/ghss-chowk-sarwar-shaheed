<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHSS Admin Panel | Hasnain Ali</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* =========================================================
   RESET
========================================================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Inter",sans-serif;
    background:#f4f7fb;
    color:#172033;
    overflow-x:hidden;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

/* =========================================================
   VARIABLES
========================================================= */
:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --secondary:#7c3aed;
    --success:#16a34a;
    --danger:#dc2626;
    --warning:#f59e0b;
    --dark:#101828;
    --muted:#667085;
    --border:#e6eaf0;
    --white:#ffffff;
    --sidebar:#0b1220;
    --sidebar2:#111b2e;
    --shadow:0 15px 45px rgba(15,23,42,.08);
}

/* =========================================================
   APP
========================================================= */
.app{
    min-height:100vh;
    display:flex;
}

/* =========================================================
   SIDEBAR
========================================================= */
.sidebar{
    width:275px;
    min-width:275px;
    min-height:100vh;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:1000;
    background:
        radial-gradient(circle at top right,rgba(37,99,235,.25),transparent 35%),
        linear-gradient(180deg,#0b1220,#080d17);
    color:white;
    padding:22px 16px;
    overflow-y:auto;
    transition:.35s ease;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 8px 24px;
    border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:22px;
}

.brand-logo{
    width:48px;
    height:48px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    box-shadow:0 10px 30px rgba(37,99,235,.35);
    font-size:22px;
}

.brand-text h2{
    font-size:15px;
    font-weight:800;
    letter-spacing:.2px;
}

.brand-text p{
    margin-top:3px;
    font-size:10px;
    color:#98a2b3;
}

.menu-title{
    padding:0 10px;
    margin:20px 0 9px;
    font-size:10px;
    font-weight:800;
    color:#667085;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.nav-btn{
    width:100%;
    border:0;
    background:transparent;
    color:#98a2b3;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 13px;
    border-radius:12px;
    margin-bottom:5px;
    text-align:left;
    transition:.25s ease;
    font-size:13px;
    font-weight:600;
}

.nav-btn:hover{
    background:rgba(255,255,255,.06);
    color:white;
    transform:translateX(3px);
}

.nav-btn.active{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    box-shadow:0 10px 25px rgba(37,99,235,.25);
}

.nav-icon{
    width:28px;
    height:28px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.07);
    font-size:14px;
}

.nav-count{
    margin-left:auto;
    min-width:24px;
    padding:3px 7px;
    border-radius:20px;
    background:rgba(255,255,255,.09);
    font-size:10px;
    text-align:center;
}

.sidebar-footer{
    margin-top:35px;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
}

.sidebar-footer small{
    color:#667085;
    font-size:9px;
}

.sidebar-footer strong{
    display:block;
    color:#d0d5dd;
    margin-top:5px;
    font-size:11px;
}

/* =========================================================
   MAIN
========================================================= */
.main{
    width:calc(100% - 275px);
    margin-left:275px;
    min-height:100vh;
}

/* =========================================================
   TOPBAR
========================================================= */
.topbar{
    height:76px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:900;
}

.mobile-menu{
    display:none;
    width:42px;
    height:42px;
    border:0;
    border-radius:12px;
    background:#f1f5f9;
    font-size:20px;
}

.top-title h1{
    font-size:19px;
    font-weight:800;
    color:var(--dark);
}

.top-title p{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.live-status{
    display:flex;
    align-items:center;
    gap:7px;
    background:#ecfdf3;
    color:#15803d;
    border:1px solid #bbf7d0;
    padding:8px 11px;
    border-radius:30px;
    font-size:10px;
    font-weight:700;
}

.live-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#22c55e;
    animation:pulse 1.7s infinite;
}

@keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}
    50%{box-shadow:0 0 0 7px rgba(34,197,94,0)}
}

.admin-badge{
    width:39px;
    height:39px;
    border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:13px;
    font-weight:800;
}

/* =========================================================
   CONTENT
========================================================= */
.content{
    padding:28px;
    max-width:1700px;
    margin:auto;
}

/* =========================================================
   HERO
========================================================= */
.hero{
    position:relative;
    overflow:hidden;
    border-radius:24px;
    padding:28px;
    color:white;
    background:
        radial-gradient(circle at 85% 15%,rgba(255,255,255,.22),transparent 22%),
        radial-gradient(circle at 70% 100%,rgba(124,58,237,.5),transparent 30%),
        linear-gradient(135deg,#1d4ed8,#4338ca 55%,#6d28d9);
    box-shadow:0 20px 55px rgba(37,99,235,.18);
    margin-bottom:24px;
}

.hero:before,
.hero:after{
    content:"";
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.12);
}

.hero:before{
    width:220px;
    height:220px;
    right:-80px;
    top:-90px;
}

.hero:after{
    width:300px;
    height:300px;
    right:-120px;
    bottom:-220px;
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero-tag{
    display:inline-flex;
    padding:7px 11px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.16);
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
}

.hero h2{
    margin-top:12px;
    font-size:27px;
    font-weight:900;
}

.hero p{
    max-width:650px;
    color:#dbeafe;
    margin-top:7px;
    line-height:1.6;
    font-size:12px;
}

.hero-credit{
    margin-top:18px;
    font-size:10px;
    color:#dbeafe;
}

.hero-credit strong{
    color:white;
}

/* =========================================================
   STATS
========================================================= */
.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    margin-bottom:24px;
}

.stat-card{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    transition:.3s ease;
}

.stat-card:hover{
    transform:translateY(-4px);
    box-shadow:0 20px 45px rgba(15,23,42,.12);
}

.stat-card:after{
    content:"";
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    right:-25px;
    top:-25px;
    background:#eff6ff;
}

.stat-icon{
    width:40px;
    height:40px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eff6ff;
    font-size:18px;
    margin-bottom:13px;
}

.stat-card:nth-child(2) .stat-icon{
    background:#f0fdf4;
}

.stat-card:nth-child(3) .stat-icon{
    background:#faf5ff;
}

.stat-card:nth-child(4) .stat-icon{
    background:#fff7ed;
}

.stat-card:nth-child(5) .stat-icon{
    background:#fef2f2;
}

.stat-number{
    font-size:25px;
    font-weight:900;
    color:var(--dark);
}

.stat-label{
    color:var(--muted);
    font-size:10px;
    margin-top:4px;
    font-weight:600;
}

/* =========================================================
   TOOLBAR
========================================================= */
.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.search-box{
    position:relative;
    flex:1;
    min-width:220px;
}

.search-box input{
    width:100%;
    height:46px;
    border:1px solid var(--border);
    border-radius:13px;
    padding:0 15px 0 42px;
    outline:none;
    background:white;
    font-size:12px;
    transition:.25s;
}

.search-box input:focus{
    border-color:#93c5fd;
    box-shadow:0 0 0 4px #eff6ff;
}

.search-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#98a2b3;
}

.toolbar-right{
    display:flex;
    gap:9px;
}

.btn{
    border:0;
    min-height:44px;
    padding:0 15px;
    border-radius:12px;
    font-size:11px;
    font-weight:800;
    transition:.25s;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    color:white;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    box-shadow:0 10px 22px rgba(37,99,235,.2);
}

.btn-light{
    background:white;
    color:#344054;
    border:1px solid var(--border);
}

/* =========================================================
   UPLOAD PANEL
========================================================= */
.upload-panel{
    display:none;
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
    margin-bottom:22px;
    box-shadow:var(--shadow);
    animation:slideDown .3s ease;
}

.upload-panel.show{
    display:block;
}

@keyframes slideDown{
    from{
        opacity:0;
        transform:translateY(-12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.panel-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.panel-heading h3{
    font-size:15px;
    font-weight:800;
}

.panel-heading p{
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

.close-btn{
    width:34px;
    height:34px;
    border:0;
    background:#f2f4f7;
    border-radius:10px;
}

.upload-grid{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:18px;
}

.drop-zone{
    min-height:220px;
    border:2px dashed #cbd5e1;
    border-radius:17px;
    background:#f8fafc;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
    transition:.25s;
}

.drop-zone.dragover{
    border-color:#2563eb;
    background:#eff6ff;
    transform:scale(1.01);
}

.upload-icon{
    width:60px;
    height:60px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    background:#eff6ff;
    margin-bottom:13px;
}

.drop-zone h4{
    font-size:14px;
}

.drop-zone p{
    color:var(--muted);
    font-size:10px;
    margin:7px 0 15px;
}

.file-input{
    display:none;
}

.upload-form{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.form-label{
    font-size:10px;
    font-weight:800;
    color:#344054;
}

.form-control{
    width:100%;
    min-height:43px;
    border:1px solid var(--border);
    border-radius:11px;
    outline:none;
    padding:9px 12px;
    font-size:11px;
    background:#fff;
}

textarea.form-control{
    min-height:82px;
    resize:vertical;
}

.form-control:focus{
    border-color:#93c5fd;
    box-shadow:0 0 0 3px #eff6ff;
}

.file-preview{
    display:none;
    margin-top:12px;
    border-radius:14px;
    overflow:hidden;
    height:120px;
    background:#f2f4f7;
}

.file-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================================================
   PROGRESS
========================================================= */
.progress-wrap{
    display:none;
    margin-top:15px;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    font-weight:700;
    margin-bottom:6px;
}

.progress-bar{
    height:8px;
    background:#edf2f7;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    width:0;
    height:100%;
    border-radius:20px;
    background:linear-gradient(90deg,#2563eb,#7c3aed);
    transition:width .3s ease;
}

/* =========================================================
   SECTION
========================================================= */
.section{
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
}

.section-head{
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:11px;
}

.section-title-icon{
    width:38px;
    height:38px;
    border-radius:11px;
    background:#eff6ff;
    display:flex;
    justify-content:center;
    align-items:center;
}

.section-title h3{
    font-size:14px;
    font-weight:800;
}

.section-title p{
    color:var(--muted);
    font-size:9px;
    margin-top:3px;
}

.result-count{
    color:#667085;
    font-size:10px;
    font-weight:700;
}

/* =========================================================
   PHOTO GRID
========================================================= */
.photo-grid{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.photo-card{
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    background:white;
    transition:.3s ease;
    animation:cardIn .4s ease both;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.photo-card:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 35px rgba(15,23,42,.12);
}

.photo-image{
    height:190px;
    position:relative;
    background:#f1f5f9;
    overflow:hidden;
}

.photo-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.45s ease;
}

.photo-card:hover .photo-image img{
    transform:scale(1.06);
}

.photo-badge{
    position:absolute;
    left:9px;
    top:9px;
    padding:5px 8px;
    border-radius:20px;
    color:white;
    background:rgba(15,23,42,.68);
    backdrop-filter:blur(8px);
    font-size:8px;
    font-weight:800;
}

.photo-body{
    padding:12px;
}

.photo-name{
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.photo-caption{
    color:var(--muted);
    font-size:9px;
    margin-top:4px;
    min-height:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.photo-actions{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    margin-top:11px;
}

.action-btn{
    height:33px;
    border:0;
    border-radius:9px;
    font-size:10px;
    font-weight:800;
    transition:.2s;
}

.action-btn:hover{
    transform:translateY(-1px);
}

.view-btn{
    background:#eff6ff;
    color:#2563eb;
}

.edit-btn{
    background:#f5f3ff;
    color:#7c3aed;
}

.delete-btn{
    background:#fef2f2;
    color:#dc2626;
}

/* =========================================================
   EMPTY
========================================================= */
.empty{
    padding:65px 20px;
    text-align:center;
    display:none;
}

.empty-icon{
    width:70px;
    height:70px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    background:#f2f4f7;
    font-size:28px;
}

.empty h3{
    font-size:15px;
}

.empty p{
    color:var(--muted);
    font-size:10px;
    margin-top:5px;
}

/* =========================================================
   LOADING
========================================================= */
.loading{
    padding:55px 20px;
    text-align:center;
}

.spinner{
    width:35px;
    height:35px;
    border:3px solid #e5e7eb;
    border-top-color:#2563eb;
    border-radius:50%;
    margin:auto;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.loading p{
    color:var(--muted);
    font-size:10px;
    margin-top:12px;
}

/* =========================================================
   MODAL
========================================================= */
.modal{
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(2,6,23,.72);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
    animation:fadeIn .25s ease;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

.modal-box{
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:22px;
    box-shadow:0 30px 90px rgba(0,0,0,.25);
    animation:modalIn .3s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.94) translateY(15px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.modal-head{
    padding:17px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-head h3{
    font-size:14px;
}

.modal-close{
    width:34px;
    height:34px;
    border:0;
    border-radius:10px;
    background:#f2f4f7;
}

.modal-body{
    padding:20px;
}

.preview-image{
    width:100%;
    max-height:65vh;
    object-fit:contain;
    border-radius:13px;
    background:#f8fafc;
}

/* =========================================================
   EDIT MODAL
========================================================= */
.edit-grid{
    display:grid;
    gap:13px;
}

.edit-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:8px;
}

/* =========================================================
   TOAST
========================================================= */
.toast-container{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:5000;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.toast{
    min-width:270px;
    max-width:350px;
    background:#101828;
    color:white;
    padding:13px 15px;
    border-radius:13px;
    box-shadow:0 18px 40px rgba(0,0,0,.2);
    display:flex;
    align-items:center;
    gap:10px;
    animation:toastIn .3s ease;
    font-size:11px;
    font-weight:600;
}

.toast.success{
    border-left:4px solid #22c55e;
}

.toast.error{
    border-left:4px solid #ef4444;
}

.toast.info{
    border-left:4px solid #3b82f6;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateX(3
