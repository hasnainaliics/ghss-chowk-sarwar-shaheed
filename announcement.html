<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Class 12th Promotion Fee Announcement | GHSS Chowk Sarwar Shaheed</title>

    <!-- PREMIUM FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================
           BASIC RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family: 'DM Sans', sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(18, 137, 99, 0.08),
                    transparent 35%
                ),
                #f5f8f6;

            color: #17251f;

            line-height: 1.7;

        }


        a {
            text-decoration: none;
        }



        /* =========================================
           TOP BAR
        ========================================= */

        .top-bar {

            background: #052d22;

            color: rgba(255,255,255,0.75);

            padding: 9px 6%;

            font-size: 11px;

            letter-spacing: 0.8px;

            text-align: center;

        }


        .top-bar strong {

            color: #f7d96b;

        }



        /* =========================================
           HEADER
        ========================================= */

        .header {

            background: rgba(255,255,255,0.97);

            padding: 17px 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.07);

            position: sticky;

            top: 0;

            z-index: 1000;

        }


        .logo-area {

            display: flex;

            align-items: center;

            gap: 14px;

        }


        .school-logo {

            width: 57px;

            height: 57px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #075b42,
                    #0c956c
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1px;

            box-shadow:
                0 8px 20px rgba(7,91,66,0.25);

        }


        .school-name h1 {

            font-family: 'Playfair Display', serif;

            font-size: 18px;

            line-height: 1.2;

            color: #12251e;

        }


        .school-name p {

            margin-top: 3px;

            color: #087953;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.5px;

        }


        .home-btn {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            background: #087953;

            color: white;

            padding: 11px 18px;

            border-radius: 8px;

            font-size: 12px;

            font-weight: 700;

            transition: 0.3s;

            box-shadow:
                0 7px 18px rgba(8,121,83,0.18);

        }


        .home-btn:hover {

            background: #064f3a;

            transform: translateY(-2px);

        }



        /* =========================================
           HERO
        ========================================= */

        .hero {

            position: relative;

            overflow: hidden;

            padding: 90px 20px 115px;

            text-align: center;

            color: white;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(126,226,187,0.16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(247,217,107,0.12),
                    transparent 28%
                ),
                linear-gradient(
                    135deg,
                    #052d22,
                    #087953
                );

        }


        .hero::before {

            content: "";

            position: absolute;

            width: 280px;

            height: 280px;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 50%;

            top: -120px;

            right: -80px;

        }


        .hero::after {

            content: "";

            position: absolute;

            width: 180px;

            height: 180px;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 50%;

            bottom: -90px;

            left: -50px;

        }


        .official-badge {

            position: relative;

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 16px;

            border: 1px solid rgba(255,255,255,0.3);

            border-radius: 50px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(8px);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 2px;

            margin-bottom: 22px;

        }


        .official-dot {

            width: 7px;

            height: 7px;

            background: #f7d96b;

            border-radius: 50%;

            box-shadow:
                0 0 0 5px rgba(247,217,107,0.12);

        }


        .hero h2 {

            position: relative;

            max-width: 850px;

            margin: auto;

            font-family: 'Playfair Display', serif;

            font-size: clamp(42px, 7vw, 76px);

            line-height: 1.04;

            letter-spacing: -1px;

        }


        .hero h2 span {

            color: #f7d96b;

        }


        .hero-description {

            position: relative;

            max-width: 650px;

            margin: 20px auto 0;

            color: rgba(255,255,255,0.82);

            font-size: 15px;

        }



        /* =========================================
           NOTICE CONTAINER
        ========================================= */

        .notice-wrapper {

            width: 90%;

            max-width: 930px;

            margin: -65px auto 90px;

            position: relative;

            z-index: 5;

        }


        .notice-card {

            background: white;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(5,45,34,0.13);

            border: 1px solid #e4ebe7;

        }



        /* =========================================
           NOTICE HEADER
        ========================================= */

        .notice-header {

            padding: 28px 38px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            border-bottom: 1px solid #e8eeeb;

        }


        .notice-type {

            display: flex;

            align-items: center;

            gap: 10px;

            color: #087953;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1.5px;

        }


        .notice-icon {

            width: 40px;

            height: 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            background: #e8f7f1;

            font-size: 18px;

        }


        .notice-date {

            color: #7a867f;

            font-size: 11px;

            font-weight: 600;

        }



        /* =========================================
           NOTICE BODY
        ========================================= */

        .notice-body {

            padding: 48px;

        }


        .notice-title {

            font-family: 'Playfair Display', serif;

            font-size: clamp(30px, 5vw, 48px);

            line-height: 1.15;

            color: #14251e;

            margin-bottom: 25px;

        }


        .notice-title span {

            position: relative;

            z-index: 1;

        }


        .notice-title span::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: 3px;

            width: 100%;

            height: 10px;

            background: #f7d96b;

            opacity: 0.6;

            z-index: -1;

            transform: rotate(-1deg);

        }


        .greeting {

            color: #087953;

            font-weight: 800;

            font-size: 14px;

            margin-bottom: 15px;

        }


        .notice-body p {

            color: #5d6b64;

            font-size: 15px;

            margin-bottom: 18px;

        }



        /* =========================================
           MAIN HIGHLIGHT
        ========================================= */

        .main-highlight {

            margin: 32px 0;

            padding: 30px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #edf9f4,
                    #f8fcfa
                );

            border: 1px solid #d5eee3;

            position: relative;

            overflow: hidden;

        }


        .main-highlight::before {

            content: "";

            position: absolute;

            width: 90px;

            height: 90px;

            border-radius: 50%;

            background: rgba(8,121,83,0.06);

            right: -25px;

            top: -25px;

        }


        .highlight-label {

            display: inline-block;

            background: #087953;

            color: white;

            padding: 6px 11px;

            border-radius: 5px;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1.5px;

            margin-bottom: 14px;

        }


        .main-highlight h3 {

            font-family: 'Playfair Display', serif;

            font-size: 28px;

            color: #0b4f3b;

            margin-bottom: 10px;

        }


        .main-highlight p {

            margin: 0;

            color: #4f6259;

        }



        /* =========================================
           FEE BOX
        ========================================= */

        .fee-box {

            margin: 30px 0;

            padding: 28px;

            border-radius: 15px;

            background: #fffdf1;

            border: 1px solid #f0df87;

            position: relative;

        }


        .fee-box::before {

            content: "";

            position: absolute;

            left: 0;

            top: 0;

            bottom: 0;

            width: 5px;

            background: #e5bd27;

            border-radius: 15px 0 0 15px;

        }


        .fee-box h3 {

            color: #67520a;

            font-size: 17px;

            margin-bottom: 10px;

            font-weight: 800;

        }


        .fee-box p {

            margin-bottom: 0;

            color: #645b35;

        }


        .yellow-text {

            background:
                linear-gradient(
                    transparent 52%,
                    #f7d96b 52%
                );

            color: #17251f;

            font-weight: 800;

            padding: 0 3px;

        }



        /* =========================================
           ACTION STEPS
        ========================================= */

        .steps-title {

            font-family: 'Playfair Display', serif;

            font-size: 27px;

            margin: 38px 0 20px;

            color: #17251f;

        }


        .steps {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 15px;

        }


        .step {

            padding: 22px;

            border: 1px solid #e3ebe7;

            border-radius: 13px;

            background: #fbfdfc;

            transition: 0.3s;

        }


        .step:hover {

            transform: translateY(-4px);

            box-shadow:
                0 12px 28px rgba(0,0,0,0.06);

        }


        .step-number {

            width: 34px;

            height: 34px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #0b7a59;

            color: white;

            font-size: 11px;

            font-weight: 800;

            margin-bottom: 14px;

        }


        .step h4 {

            font-size: 14px;

            margin-bottom: 6px;

            color: #193128;

        }


        .step p {

            font-size: 12px;

            margin: 0;

            color: #718078;

        }



        /* =========================================
           IMPORTANT REMINDER
        ========================================= */

        .reminder {

            margin-top: 30px;

            padding: 20px 22px;

            border-radius: 12px;

            background: #092f25;

            color: white;

            display: flex;

            align-items: center;

            gap: 15px;

        }


        .reminder-icon {

            font-size: 25px;

        }


        .reminder strong {

            color: #f7d96b;

        }


        .reminder p {

            margin: 2px 0 0;

            color: rgba(255,255,255,0.75);

            font-size: 12px;

        }



        /* =========================================
           SIGNATURE
        ========================================= */

        .signature {

            margin-top: 42px;

            padding-top: 28px;

            border-top: 1px solid #e7ece9;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

        }


        .signature-name {

            font-family: 'Playfair Display', serif;

            font-size: 19px;

            color: #183229;

        }


        .signature-role {

            color: #087953;

            font-size: 11px;

            font-weight: 700;

        }


        .official-seal {

            width: 72px;

            height: 72px;

            border: 2px solid #0b7a59;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: #087953;

            font-size: 8px;

            font-weight: 800;

            letter-spacing: 1px;

        }



        /* =========================================
           BACK BUTTON
        ========================================= */

        .back-area {

            text-align: center;

            margin-top: 30px;

        }


        .back-btn {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 13px 22px;

            border: 1px solid #0b7a59;

            border-radius: 8px;

            color: #087953;

            background: white;

            font-size: 12px;

            font-weight: 800;

            transition: 0.3s;

        }


        .back-btn:hover {

            background: #087953;

            color: white;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(8,121,83,0.18);

        }



        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            background: #041c16;

            color: white;

            padding: 50px 6% 22px;

            text-align: center;

        }


        .footer h3 {

            font-family: 'Playfair Display', serif;

            font-size: 20px;

            margin-bottom: 7px;

        }


        .footer p {

            color: rgba(255,255,255,0.55);

            font-size: 11px;

        }


        .copyright {

            margin-top: 25px;

            padding-top: 18px;

            border-top: 1px solid rgba(255,255,255,0.1);

            color: rgba(255,255,255,0.38);

            font-size: 10px;

        }



        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .header {

                padding: 14px 5%;

            }


            .school-name h1 {

                font-size: 14px;

            }


            .school-name p {

                font-size: 10px;

            }


            .school-logo {

                width: 48px;

                height: 48px;

                border-radius: 14px;

            }


            .home-btn {

                padding: 9px 12px;

                font-size: 10px;

            }


            .hero {

                padding: 65px 18px 100px;

            }


            .hero h2 {

                font-size: 43px;

            }


            .hero-description {

                font-size: 13px;

            }


            .notice-wrapper {

                width: 92%;

                margin-top: -55px;

            }


            .notice-header {

                padding: 20px;

                align-items: flex-start;

                flex-direction: column;

            }


            .notice-body {

                padding: 30px 22px;

            }


            .steps {

                grid-template-columns: 1fr;

            }


            .signature {

                align-items: flex-start;

            }

        }


        @media (max-width: 430px) {

            .home-btn {

                font-size: 0;

            }


            .home-btn::after {

                content: "⌂";

                font-size: 18px;

            }


            .hero h2 {

                font-size: 38px;

            }


            .notice-title {

                font-size: 31px;

            }


            .main-highlight {

                padding: 23px;

            }


            .fee-box {

                padding: 23px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         TOP BAR
    ========================================== -->

    <div class="top-bar">

        <strong>OFFICIAL SCHOOL NOTICE</strong>
        &nbsp; • &nbsp;
        Government Higher Secondary School Chowk Sarwar Shaheed

    </div>



    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <div class="logo-area">

            <div class="school-logo">
                GHSS
            </div>

            <div class="school-name">

                <h1>
                    Government Higher Secondary School
                </h1>

                <p>
                    Chowk Sarwar Shaheed
                </p>

            </div>

        </div>


        <a href="index.html" class="home-btn">
            ← Home
        </a>

    </header>



    <!-- =========================================
         HERO
    ========================================== -->

    <section class="hero">

        <div class="official-badge">

            <span class="official-dot"></span>

            IMPORTANT ANNOUNCEMENT

        </div>


        <h2>
            Class <span>12th</span>
            Promotion Fee
