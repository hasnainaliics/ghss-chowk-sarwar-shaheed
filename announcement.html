<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Class 12th Promotion Fee Announcement | GHSS Chowk Sarwar Shaheed</title>

    <!-- PREMIUM FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link

        rel="stylesheet"
    >


    <style>

        /* =========================================
           BASIC RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family: 'DM Sans', sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(18, 137, 99, 0.08),
                    transparent 35%
                ),
                #f5f8f6;

            color: #17251f;

            line-height: 1.7;

        }


        a {
            text-decoration: none;
        }



        /* =========================================
           TOP BAR
        ========================================= */

        .top-bar {

            background: #052d22;

            color: rgba(255,255,255,0.75);

            padding: 9px 6%;

            font-size: 11px;

            letter-spacing: 0.8px;

            text-align: center;

        }


        .top-bar strong {

            color: #f7d96b;

        }



        /* =========================================
           HEADER
        ========================================= */

        .header {

            background: rgba(255,255,255,0.97);

            padding: 17px 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.07);

            position: sticky;

            top: 0;

            z-index: 1000;

        }


        .logo-area {

            display: flex;

            align-items: center;

            gap: 14px;

        }


        .school-logo {

            width: 57px;

            height: 57px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #075b42,
                    #0c956c
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1px;

            box-shadow:
                0 8px 20px rgba(7,91,66,0.25);

        }


        .school-name h1 {

            font-family: 'Playfair Display', serif;

            font-size: 18px;

            line-height: 1.2;

            color: #12251e;

        }


        .school-name p {

            margin-top: 3px;

            color: #087953;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.5px;

        }


        .home-btn {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            background: #087953;

            color: white;

            padding: 11px 18px;

            border-radius: 8px;

            font-size: 12px;

            font-weight: 700;

            transition: 0.3s;

            box-shadow:
                0 7px 18px rgba(8,121,83,0.18);

        }


        .home-btn:hover {

            background: #064f3a;

            transform: translateY(-2px);

        }



        /* =========================================
           HERO
        ========================================= */

        .hero {

            position: relative;

            overflow: hidden;

            padding: 90px 20px 115px;

            text-align: center;

            color: white;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(126,226,187,0.16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(247,217,107,0.12),
                    transparent 28%
                ),
                linear-gradient(
                    135deg,
                    #052d22,
                    #087953
                );

        }


        .hero::before {

            content: "";

            position: absolute;

            width: 280px;

            height: 280px;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 50%;

            top: -120px;

            right: -80px;

        }


        .hero::after {

            content: "";

            position: absolute;

            width: 180px;

            height: 180px;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 50%;

            bottom: -90px;

            left: -50px;

        }


        .official-badge {

            position: relative;

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 16px;

            border: 1px solid rgba(255,255,255,0.3);

            border-radius: 50px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(8px);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 2px;

            margin-bottom: 22px;

        }


        .official-dot {

            width: 7px;

            height: 7px;

            background: #f7d96b;

            border-radius: 50%;

            box-shadow:
                0 0 0 5px rgba(247,217,107,0.12);

        }


        .hero h2 {

            position: relative;

            max-width: 850px;

            margin: auto;

            font-family: 'Playfair Display', serif;

            font-size: clamp(42px, 7vw, 76px);

            line-height: 1.04;

            letter-spacing: -1px;

        }


        .hero h2 span {

            color: #f7d96b;

        }


        .hero-description {

            position: relative;

            max-width: 650px;

            margin: 20px auto 0;

            color: rgba(255,255,255,0.82);

            font-size: 15px;

        }

           NOTICE CONTAINER

        .notice-wrapper {

            margin: -65px auto 90px;

            position: relative;

            z-index: 5;

        }


        .notice-card {

            background: white;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(5,45,34,0.13);

            border: 1px solid #e4ebe7;

        }

           NOTICE HEADER
        ========================================= */

        .notice-header {

            padding: 28px 38px;

            justify-content: space-between;

            gap: 20px;

            border-bottom: 1px solid #e8eeeb;

        }


        .notice-type {

            display: flex;

            align-items: center;

            gap: 10px;

            color: #087953;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1.5px;

        }


        .notice-icon {

            width: 40px;

            height: 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            background: #e8f7f1;

            font-size: 18px;

        }


        .notice-date {

            color: #7a867f;

            font-size: 11px;

            font-weight: 600;

        }



        /* =========================================
           NOTICE BODY
        ========================================= */

        .notice-body {

            padding: 48px;

        }


        .notice-title {

            font-family: 'Playfair Display', serif;

            font-size: clamp(30px, 5vw, 48px);

            line-height: 1.15;

            color: #14251e;

            margin-bottom: 25px;

        }


        .notice-title span {

            position: relative;

            z-index: 1;

        }
