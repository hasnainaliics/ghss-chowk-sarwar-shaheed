<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>طلبہ کے لیے خصوصی پیغام</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f2f7f5;
            font-family: Arial, sans-serif;
        }

        .top {
            background: linear-gradient(135deg, #075e54, #087f70);
            color: white;
            text-align: center;
            padding: 22px 15px;
        }

        .top h1 {
            margin: 0;
            font-size: 28px;
        }

        .top p {
            margin: 7px 0 0;
            font-size: 16px;
        }

        .home {
            display: inline-block;
            margin-bottom: 12px;
            padding: 8px 18px;
            background: white;
            color: #075e54;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .poster {
            width: 100%;
            max-width: 1000px;
            display: block;
            margin: 25px auto;
            padding: 0 12px;
        }

        .poster img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        }

        .message {
            max-width: 900px;
            margin: 0 auto 25px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .message h2 {
            color: #075e54;
            margin-top: 0;
        }

        .message p {
            line-height: 2;
            margin-bottom: 0;
        }

        footer {
            background: #075e54;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .top h1 {
                font-size: 23px;
            }

            .poster {
                padding: 0 7px;
            }

            .poster img {
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>

    <header class="top">

        <a href="index.html" class="home">🏠 ہوم</a>

        <h1>📢 طلبہ کے لیے خصوصی پیغام</h1>

        <p>گورنمنٹ ہائر سیکنڈری سکول چوک سرور شہید</p>

    </header>


    <main>

        <div class="poster">

            <img src="file_00000000d888211b22e6735272e3a61.png"
     alt="طلبہ کے لیے خصوصی پیغام">

        </div>


        <section class="message">

            <h2>🌟 آپ کا مستقبل، آپ کی محنت</h2>

            <p>
                اپنے مقصد پر توجہ دیں، باقاعدگی سے پڑھیں اور
                اپنی محنت پر یقین رکھیں۔
                آپ کی کامیابی ہمارے لیے بھی خوشی کا باعث ہے۔
            </p>

        </section>

    </main>


    <footer>
        گورنمنٹ ہائر سیکنڈری سکول چوک سرور شہید
        <br>
        علم • محنت • نظم و ضبط • کامیابی
    </footer>

</body>

  </html>
